name: Deploy viewer to GitHub Pages

# Publishes the committed viewer/ as-is. District packages (GLBs, chunks, JSON) are
# rebuilt and Meshopt-compressed locally with `python -m cityview district build <id>`
# and committed; this workflow never runs Blender. See docs/district-agent.md.

on:
  push:
    # Only main publishes the live site. Feature-branch pushes were cancelling
    # in-progress main deploys via the shared concurrency group.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
