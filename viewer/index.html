      (async () => {
        try {
          setLoad(0, "Fetching the streets");
          const buf = await window.__glbPromise;
          // After the city file, so posters and portraits don't compete with it.
          menu?.loadArt?.();
          // Only the starter rider and the saved neighbour. The rest start once the city is visible.
          preloadStarter();
          preloadPlayer();
          setLoad(0.82, "Unpacking the streets");
          await nextFrame();
          await MeshoptDecoder.ready;
          // Decode EXT_meshopt_compression off the main thread. Without workers,
          // each chunk's WASM decode pins the walk loop (7 FPS until priming ends).
          if (typeof MeshoptDecoder.useWorkers === "function") {
            MeshoptDecoder.useWorkers(2);
          }
          const gltf = await loader.parseAsync(buf, "./");
          await onCityLoaded(gltf);
        } catch (err) {
          status.textContent = "Missing GLB — CI/build pending";
          window.__loading && window.__loading.fail("Couldn’t load Antwerp — check your connection and reload");
          console.error(err);
        }
      })();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        visuals.resize(window.innerWidth, window.innerHeight);
      });

      // Adaptive render resolution: step the pixel ratio down only when the GPU is clearly
      // struggling (avg > 27 ms/frame), and probe back up occasionally. A level that failed
      // right after a probe becomes the new ceiling so it never oscillates.
      let adaptFrames = 0;
      let adaptTime = 0;
      let adaptSettle = 120; // frames to ignore after any change / load
      let adaptCeil = PR_MAX;
      let adaptProbed = false;
      let adaptGood = 0;
      function adaptResolution(rawDt) {
        if (adaptSettle > 0) {
          adaptSettle--;
          return;
        }
        if (rawDt > 0.25 || document.hidden) return; // tab switch / hitch, not GPU load
        adaptTime += rawDt;
        if (++adaptFrames < 90) return;
        const avg = adaptTime / adaptFrames;
        adaptFrames = 0;
        adaptTime = 0;
        let next = pixelRatio;
        if (avg > 0.027 && pixelRatio > PR_MIN) {
          if (adaptProbed) adaptCeil = Math.max(PR_MIN, pixelRatio - 0.1);
          next = Math.max(PR_MIN, pixelRatio - 0.15);
          adaptGood = 0;
          adaptProbed = false;
        } else if (avg < 0.0185 && pixelRatio < adaptCeil) {
          if (++adaptGood >= 4) {
            next = Math.min(adaptCeil, pixelRatio + 0.1);
            adaptProbed = true;
            adaptGood = 0;
          }
        } else {
          adaptProbed = false;
          adaptGood = 0;
        }
        if (Math.abs(next - pixelRatio) > 1e-3) {
          pixelRatio = next;
          renderer.setPixelRatio(pixelRatio);
          visuals.setPixelRatio(pixelRatio);
          adaptSettle = 90;
        }
      }

      function tap(code) {
        fromPad = true;
        window.dispatchEvent(new KeyboardEvent("keydown", { code, bubbles: true, cancelable: true }));
        fromPad = false;
      }

      function releasePadHeld() {
        if (padDrive) {
          keys.w = kb.w;
          keys.a = kb.a;
          keys.s = kb.s;
          keys.d = kb.d;
          padDrive = false;
        }
        if (padSprint) {
          keys.shift = kb.shift;
          padSprint = false;
        }
        if (padJump) {
          keys.space = kb.space;
          padJump = false;
        }
      }

      let padWheel = false;
      let padFire = false;
      let padAim = false;
      /** GTA pad: LT aims (sprints bare-handed), RT fires, LB holds the wheel, B reloads (kicks bare-handed). */
      function padCombat(g) {
        const fire = !!g?.down.r2;
        const aim = !!g?.down.l2 && combat.armed;
        const wheel = !!g?.down.l1;
        if (fire !== padFire) combat.setTrigger((padFire = fire));
        if (aim !== padAim) combat.setAim((padAim = aim));
        if (wheel !== padWheel) {
          padWheel = wheel;
          if (wheel) combatPlayer.hud.resetCursor();
          combat.setWheel(wheel);
        }
        if (!g) return;
        if (wheel) combatPlayer.hud.point(g.sticks.rx, g.sticks.ry, true);
        if (g.pressed.circle) {
          if (combat.armed) combat.reload();
          else combat.kick();
        }
      }

      function applyGamepad(dt) {
        const g = gamepad.sample();
        if (!g.layout) {
          releasePadHeld();
          return;
        }
        if (menu && menu.open) {
          releasePadHeld();
          return;
        }
        const moving = g.move.w || g.move.a || g.move.s || g.move.d;
        if (moving || padDrive) {
          keys.w = kb.w || g.move.w;
          keys.a = kb.a || g.move.a;
          keys.s = kb.s || g.move.s;
          keys.d = kb.d || g.move.d;
          const kbMove = kb.w || kb.a || kb.s || kb.d;
          keys.stick = moving && !kbMove ? { x: g.sticks.lx, y: -g.sticks.ly } : null;
          padDrive = moving;
        }
        // LT is the aim trigger once a gun is out; bare-handed it stays sprint.
        const padRun = g.sprint && !combat.armed;
        if (padRun || padSprint) {
          keys.shift = kb.shift || padRun;
          padSprint = padRun;
        }
        if (g.jump || padJump) {
          keys.space = kb.space || g.jump;
          padJump = g.jump;
        }
        if (g.pressed.options && sessionStarted) {
          menu.show();
          return;
        }
        if (g.pressed.square) tap("KeyE");
        if (mode === "walk" && !handsBusy()) padCombat(g);
        else padCombat(null);
        if (g.pressed.triangle) tap("KeyN");
        if (g.pressed.r1) tap("KeyH");
        if (g.pressed.up) tap("KeyV");
        if (g.pressed.down) tap("KeyM");
        if (
          mode === "walk" &&
          !playerCrash.active &&
          !combat.wheelOpen &&
          !(transit.isRiding && transit.isRiding()) &&
          (g.look.x || g.look.y)
        ) {
          applyLookDelta(g.look.x * 900 * dt, g.look.y * 900 * dt);
        }
      }

      function tick() {
        const time = performance.now();
        const rawDt = (time - prevTime) / 1000;
        // The weapon wheel slows the whole world (GTA), not just the player.
        const slow = combatPlayer.timeScale;
        const realDt = Math.min(0.05, rawDt);
        const dt = realDt * slow;
        // Traffic and transit integrate real elapsed time themselves (sub-stepped), so a slow
        // frame does not put the whole street in slow motion. Walking/camera keep the 50 ms cap.
        const simDt = Math.min(0.25, rawDt) * slow;
        prevTime = time;
        // One read per frame. A second poll in the same frame clears button edges.
        gamepad.poll();
        if (menu && menu.open) publishStatus();
        if (!cityReady) {
          // Loading screen is up: don't burn GPU/CPU on an empty scene.
          requestAnimationFrame(tick);
          return;
        }
        if (sessionStarted && menu && !menu.open && document.visibilityState !== "hidden") {
          playSavedForMenu = false;
          const opened = playClock.tick(districtMeta.id, realDt);
          if (opened === "belt") status.textContent = "Kiel, Noord and Borgerhout are on the map.";
          else if (opened === "city") status.textContent = "Linkeroever and the port are on the map.";
        } else if (sessionStarted && menu && menu.open && !playSavedForMenu) {
          playClock.flush();
          playSavedForMenu = true;
        }
        adaptResolution(rawDt);
        applyGamepad(dt);
        if (water && cityRoot) water.tickRipples(cityRoot, dt);

        const menuOpen = menu.open;
        const ridingTram = transit.isRiding && transit.isRiding();
        const ridingVelo = velo && velo.isRiding && velo.isRiding();
        const riding = ridingTram;
        const onScooter = scooters && scooters.isRiding();
        if (interiors && !menuOpen) interiors.update(dt);
        // Inside a shop the room is the world: its floor, its walls, no street simulation.
        const inShop = !!interiors?.active;
        const shopFloor = inShop ? interiors.floorY : null;
        const scripted = !!interiors?.busy;
        {
          const wpos = walkControls.getObject().position;
          const wade = water?.at?.(wpos.x, wpos.z);
          playerMotion.setFootScale(
            playerCrash.speedScale() * combatPlayer.footScale * (wade?.footScale ?? 1),
          );
        }

        if (playerCrash.active) {
          const w = walkControls.getObject();
          _beforeStep.x = w.position.x;
          _beforeStep.z = w.position.z;
          playerCrash.update(dt, w);
          if (playerCrash.active) {
            let stopped = !!(outdoors && outdoors.rejectIfIndoors(w.position, _beforeStep));
            clampWalkerXZ(w.position);
            stopped = collideWorld(w.position, false) || stopped;
            if (stopped) playerCrash.stopHorizontal();
          } else {
            // Rise finished: boom behind the body, world-up, and clear of the vehicle.
            camera.up.copy(UP_WORLD);
            thirdPerson.snap(w.position);
            playerAvatar.setVisible(true);
            pushOutOfSolids(w.position);
            collideWorld(w.position, false);
          }
        } else if (caught) {
          playerMotion.stop();
        } else if (!menuOpen) {
          // Just stood up inside a bus or car: keep sliding clear so it does not
          // knock you straight back down and leave the camera rolled.
          if (!playerCrash.vulnerable && mode === "walk" && !inShop && !scripted) {
            const w = walkControls.getObject();
            pushOutOfSolids(w.position);
            collideWorld(w.position, false);
          }
          // ---- Jump (Space): fence-height hop, a short hang, then you just fall ----
          const canJump =
            mode === "walk" && !riding && !ridingVelo && !onScooter && !scripted && walkEngaged();
          if (!canJump) {
            JUMP.active = false;
            JUMP.v = 0;
            JUMP.y = 0;
          } else if (keys.space && !JUMP.held && !JUMP.active) {
            JUMP.v = JUMP_CFG.strength;
            JUMP.active = true;
            playerMotion.hop(JUMP_CFG.hop);
          }
          JUMP.held = !!keys.space;
          // Must run on foot — it used to sit inside the Velo/scooter block, so Space
          // never lifted you and JUMP.active stayed stuck after the first press.
          if (JUMP.active) stepJump(JUMP, dt);
          {
            const walker = walkControls.getObject();
            const baseEye = playerMotion.eye(onScooter ? "scooter" : ridingVelo ? "velo" : "walk");
            const onFoot = !riding && !ridingVelo && !onScooter;
            // Shallow water: stand on silt bed_y. Elsewhere: groundAt (never below 0).
            let surface = 0;
            if (shopFloor != null) surface = shopFloor;
            else if (onFoot) surface = walkSurface(walker.position.x, walker.position.z, dt);
            if (!scripted) walker.position.y = baseEye + surface + JUMP.y;
          }

          if (!riding && mode === "walk" && walkEngaged() && !scripted && inShop) {
            // Walking inside a shop: the room's walls, counters and people, nothing else.
            const w = walkControls.getObject();
            _beforeStep.x = w.position.x;
            _beforeStep.z = w.position.z;
            playerMotion.step(dt, combat.aiming && keys.shift ? { ...keys, shift: false } : keys, "walk");
            w.position.y = playerMotion.eye("walk") + shopFloor + JUMP.y;
            interiors.collide(w.position);
            const commanded = Math.hypot(playerMotion.state.fwd, playerMotion.state.side) * dt;
            const moved = Math.hypot(w.position.x - _beforeStep.x, w.position.z - _beforeStep.z);
            footFree += ((commanded > 1e-4 ? Math.min(1, moved / commanded) : 1) - footFree) * (1 - Math.exp(-10 * dt));
          } else if (!riding && mode === "walk" && walkEngaged() && !scripted) {
            const kind = ridingVelo ? "velo" : onScooter ? "scooter" : "walk";
            const w = walkControls.getObject();
            _beforeStep.x = w.position.x;
            _beforeStep.z = w.position.z;
            playerMotion.step(dt, combat.aiming && keys.shift ? { ...keys, shift: false } : keys, kind);
            if (knifeLunge) {
              const dx = knifeLunge.x - w.position.x;
              const dz = knifeLunge.z - w.position.z;
              const d = Math.hypot(dx, dz);
              const step = kind === "walk" ? Math.min(Math.max(0, d - 0.75), 5 * dt) : 0;
              if (d > 1e-3) {
                w.position.x += (dx / d) * step;
                w.position.z += (dz / d) * step;
              }
              if ((knifeLunge.t -= dt) <= 0) knifeLunge = null;
            }
            let surface = 0;
            if (kind === "walk") surface = walkSurface(w.position.x, w.position.z, 0);
            w.position.y = playerMotion.eye(kind) + surface + JUMP.y;
            const overlapSpeed = fastestOverlap(w.position, onScooter || ridingVelo ? 0.55 : 0.36);
            const wallHit = !!(outdoors && outdoors.rejectIfIndoors(w.position, _beforeStep));
            if (water) water.rejectIfDeep(w.position, _beforeStep, kind !== "walk");
            if (wallHit) playerMotion.bump(0.5);
            clampWalkerXZ(w.position);
            if (districtBorder) districtBorder.update();
            _afterWall.x = w.position.x;
            _afterWall.z = w.position.z;
            if (!onScooter && !ridingVelo) pushOutOfSolids(w.position);
            collideWorld(w.position, onScooter || ridingVelo);
            const commanded = Math.hypot(playerMotion.state.fwd, playerMotion.state.side) * dt;
            if (commanded > 1e-4) {
              const moved = Math.hypot(w.position.x - _beforeStep.x, w.position.z - _beforeStep.z);
              footFree += (Math.min(1, moved / commanded) - footFree) * (1 - Math.exp(-10 * dt));
            } else {
              footFree = 1;
            }
            if ((onScooter || ridingVelo) && dt > 0) {
              const yaw = playerMotion.yaw();
              const rideSpeed = playerMotion.speed;
              let impact = Math.hypot(w.position.x - _afterWall.x, w.position.z - _afterWall.z) / dt;
              if (wallHit) impact = Math.max(impact, speedIntoWall(_beforeStep, yaw, rideSpeed));
              const people = pedestrians
                ? pedestrians.hitTest(
                    w.position.x - Math.sin(yaw) * 0.4,
                    w.position.z - Math.cos(yaw) * 0.4,
                    -Math.sin(yaw) * rideSpeed,
                    -Math.cos(yaw) * rideSpeed,
                    0.3,
                  )
                : 0;
              if (people) harmedPulse = true;
              if (
                (impact > CRASH_IMPACT && Math.abs(rideSpeed) > CRASH_IMPACT) ||
                (people && Math.abs(rideSpeed) > CRASH_PERSON)
              ) {
                crashRide(
                  Math.abs(rideSpeed),
                  onScooter
                    ? `You came off the scooter at ${Math.round(Math.abs(rideSpeed) * 3.6)} km/h`
                    : `You came off the Velo at ${Math.round(Math.abs(rideSpeed) * 3.6)} km/h`,
                );
              }
            }
            if (!playerCrash.active && overlapSpeed >= HIT_SPEED) hitByVehicle(overlapSpeed);
            if (ridingVelo && velo.update && !playerCrash.active) {
              // Face the bike the way you travel — reverse flips the frame with the rider.
              const rideYaw = playerMotion.travelYaw();
              velo.update(dt, {
                x: w.position.x,
                z: w.position.z,
                yaw: rideYaw,
                moving: Math.abs(playerMotion.speed) > 0.05,
                // Speed along the bike's facing (always forward once yaw follows travel).
                speed: Math.abs(playerMotion.speed),
                pedal: playerAvatar.pedalPhase ? playerAvatar.pedalPhase() : 0,
              });
            }
            const driveBy = combat.armed && (combat.aiming || combat.sinceShot < 0.6);
            if ((onScooter || ridingVelo) && !playerCrash.active && Math.abs(playerMotion.speed) > 0.15 && !driveBy) {
              thirdPerson.easeYawToward(playerMotion.travelYaw(), dt, 3);
            }
          } else {
            playerMotion.stop();
          }
          if (scooters) {
            const w = walkControls.getObject().position;
            const rideYaw = playerMotion.travelYaw();
            scooters.update(dt, {
              x: w.x,
              z: w.z,
              yaw: rideYaw,
              // Abs once yaw follows travel so wheels roll with the deck, not against it.
              speed: Math.abs(playerMotion.speed),
              turn: (keys.d ? 1 : 0) - (keys.a ? 1 : 0),
            });
          }
          if (!riding && mode === "free") {
            const panStep = freeCam.height * 0.9 * (keys.shift ? 2.2 : 1.0) * dt;
            panFree(((keys.d ? 1 : 0) - (keys.a ? 1 : 0)) * panStep, ((keys.s ? 1 : 0) - (keys.w ? 1 : 0)) * panStep);
            applyFreeCamera();
          }
        }

        const wPos = walkControls.getObject().position;
        const moveKind = ridingVelo ? "velo" : onScooter ? "scooter" : "walk";
        const scooterDeck = onScooter && scooters?.deckAnchor ? scooters.deckAnchor() : null;
        // Eye sits just above the grip so the soles, not the ankles, meet the deck.
        if (scooterDeck) wPos.y = scooterDeck.y + 1.58;
        // The legs pace to ground speed, strafe included (A/D and every off-axis stick angle).
        const cutscene = interiors?.cutscene;
        const spd = cutscene
          ? cutscene.speed
          : moveKind === "walk"
            ? Math.hypot(playerMotion.state.fwd, playerMotion.state.side) * footFree
            : Math.abs(playerMotion.speed);
        // On wheels the body must face the bike, even when nearly stopped — otherwise the
        // pedal IK aims with the camera while the cranks face travel, and the feet twist.
        // On foot, face travel once you are moving; idle faces the camera.
        const onWheels = moveKind === "velo" || moveKind === "scooter";
        let bodyYaw =
          onWheels || (spd > 0.12 && mode === "walk") ? playerMotion.travelYaw() : thirdPerson.yaw();
        const crashing = playerCrash.active;
        const armedOnFoot = mode === "walk" && moveKind === "walk" && !ridingTram && !crashing;
        const driveByPose = onWheels && combat.armed && !crashing;
        _feet.set(wPos.x, wPos.y - eyeHeight, wPos.z);
        combatPlayer.update(menuOpen ? 0 : realDt, _feet, {
          moving: Math.min(1, spd / 3.5),
          moveYaw: onWheels || spd > 0.12 ? playerMotion.travelYaw() : thirdPerson.yaw(),
          dead: playerCrash.dead,
        });
        if (armedOnFoot) bodyYaw = combatPlayer.bodyYaw(bodyYaw);
        if (cutscene) bodyYaw = cutscene.yaw;
        if (mode === "walk" || mode === "free") {
          if (ridingTram) {
            // First-person cabin ride: keep the body off the platform (update() forces visible).
            playerAvatar.setVisible(false);
          } else {
            playerAvatar.update(
              menuOpen || crashing ? 0 : dt,
              wPos,
              crashing ? 0 : spd,
              bodyYaw,
              moveKind,
              scooterDeck,
              armedOnFoot || driveByPose ? combatPlayer.fight : null,
            );
            playerAvatar.setVisible(!crashing);
          }
        }
        if (crashing) {
          // First-person tumble: the boom would fight the fall camera.
          camera.up.copy(UP_WORLD);
          camera.position.copy(wPos);
        } else if (mode === "walk" && !riding) {
          thirdPerson.update(menuOpen ? 1 / 60 : realDt, wPos, {
            armed: (armedOnFoot || driveByPose) && combat.armed,
            aim: (armedOnFoot || driveByPose) && combat.aiming ? 1 : 0,
          });
        }

        const walker = mode === "walk" ? walkControls.getObject() : playerAvatar.root;
        if (!menuOpen && inShop) {
          // The street waits outside: only the clock keeps running.
          advanceClock(dt);
        } else if (!menuOpen) {
          advanceClock(dt);
          updateLampLights(dt, walker);
          if (stars.visible) stars.position.copy(camera.position);
          traffic.update(simDt, walker);
          transit.update(simDt, walker);
          {
            const streamH = mode === "free" ? freeCam.height : 0;
            chunkStream?.update(walker.position.x, walker.position.z, mode, streamH);
          neighbours?.update(walker.position.x, walker.position.z, mode, streamH);
            landmarkStream?.update(walker.position.x, walker.position.z, mode, streamH);
            farField?.update(walker.position.x, walker.position.z);
          }
          if (pedestrians) {
            pedestrians.setClock?.(gameHour, gameDay);
            pedestrians.update(simDt);
          }
          if (police) {
            const face = playerMotion.yaw();
            police.update(simDt, {
              x: wPos.x,
              z: wPos.z,
              dead: playerCrash.dead || caught,
              bust: bustPlayer,
              hurt: hurtPlayer,
              ranRed: !!(traffic.playerRanRed && traffic.playerRanRed(wPos.x, wPos.z, face)),
              harmed: harmedPulse,
            });
            harmedPulse = false;
          }
          if (mode === "walk") loot.update(dt, wPos.x, wPos.z);
          if (micromobility) {
            micromobility.setClock?.(gameHour);
            fillRiderObstacles(walker);
            micromobility.update(simDt, _riderObstacles);
          }
          if (traffic.setCamera) traffic.setCamera(camera.position.x, camera.position.z);
          if (transit.setCamera) transit.setCamera(camera.position.x, camera.position.z);
          if (micromobility?.setCamera) micromobility.setCamera(camera.position.x, camera.position.z);
          if (mode === "walk") considerMovingHit(walkControls.getObject().position);
        } else if (stars.visible) {
          stars.position.copy(camera.position);
        }

        // ---- Mini map (free mode teleport via click) ----
        if (minimap) {
          if (minimap._visible === undefined) minimap._visible = true;
          if (mode === "free") {
            // Check for teleport click
            const tp = minimap.consumeTeleport();
            if (tp) {
              freeCam.x = tp.x;
              freeCam.z = tp.z;
              walkSaved.x = tp.x;
              walkSaved.z = tp.z;
              softClampXZ(freeCam, playBounds);
            }
          }
          const ppos =
            mode === "walk"
              ? walkControls.getObject().position
              : mode === "free"
                ? freeCam
                : avatar.position;
          if (streetLocator && minimap.showStreetName) {
            const { street, changed } = streetLocator.update(ppos.x, ppos.z);
            if (changed && street) minimap.showStreetName(street);
          }
          if (minimap.setHeading) minimap.setHeading(playerMotion.yaw());
          minimap.draw(ppos, traffic, transit, pedestrians, mode, micromobility, velo);
        }

        // Auto-alight when the requested stop dwell begins.
        const pending = transit.consumePendingDrop && transit.consumePendingDrop();
        if (pending) applyAlightDrop(pending);

        if (riding && transit.getRideCamera && transit.getRideCamera(_rideCam, _rideLook)) {
          camera.position.lerp(_rideCam, Math.min(1, dt * 4));
          camera.lookAt(_rideLook);
        }

        if (landmarkStream && !inShop) {
          const camH = mode === "free" ? freeCam.height : camera.position.y;
          landmarkStream.update(camera.position.x, camera.position.z, mode, camH);
        }
        shops && shops.update(gameHour, gameDay, camera.position.x, camera.position.z);
        velo?.setCamera?.(camera.position.x, camera.position.z);
        terraces && !inShop && terraces.update();
        refreshRideHud();
        const sRide = scooters && scooters.isRiding() ? scooters.getRideHud() : null;
        const vRide = velo && velo.isRiding && velo.isRiding() ? velo.getRideHud() : null;
        const kmh = Math.abs(playerMotion.speed) * 3.6;
        hud.setHealth(playerCrash.health);
        hud.update(rawDt, {
          hour: gameHour,
          dayIndex: gameDay,
          riding: sRide
            ? { speedKmh: kmh, battery: sRide.battery, sub: `${sRide.brand} · ${sRide.time} · €${sRide.cost.toFixed(2)}` }
            : vRide
              ? { speedKmh: kmh, battery: null, sub: `Velo · ${vRide.name || "city bike"}` }
              : null,
          stats: () => {
            const p = walkControls.getObject().position;
            return {
              pos: `${p.x.toFixed(1)}, ${p.z.toFixed(1)}`,
              speed: `${(Math.abs(playerMotion.speed) * 3.6).toFixed(1)} km/h`,
              res: `${pixelRatio.toFixed(2)}x`,
              calls: renderer.info.render.calls,
              tris: renderer.info.render.triangles,
            };
          },
        });

        // Keep the sun shadow camera locked to the walker every frame.
        if (visuals.high()) {
          const dayAmt = 1 - (() => {
            const u = Math.min(1, Math.max(0, (tod - 0.0) / 0.7));
            return u * u * (3 - 2 * u);
          })();
          visuals.update({
            tod,
            hour: gameHour,
            dayAmt,
            playerPos: walkControls.getObject().position,
            exposure: renderer.toneMappingExposure,
            sunAim: _sunAim,
          });
        }
        visuals.render();
        requestAnimationFrame(tick);
      }
      tick();
    </script>
  </body>
</html>
