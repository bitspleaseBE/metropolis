<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Metropolis — Klein Antwerpen</title>
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <style>
      :root {
        --ink: #1a2430;
        --muted: #3d4a5c;
        --panel: rgba(255, 255, 255, 0.82); /* opaque-ish: no backdrop-filter over the live canvas */
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #06080c;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        color: var(--ink);
      }
      canvas {
        display: block;
        touch-action: none;
      }

      /* ---- Loading screen: GTA-style Antwerp key art (port, cathedral, diamonds, cast) ---- */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
        background: #06080c;
        transition: opacity 0.7s ease, visibility 0s linear 0.7s;
      }
      #loading.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #loading .ld-art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 40%;
        pointer-events: none;
        transform: scale(1.04);
        animation: ld-ken 18s ease-in-out alternate infinite;
      }
      @keyframes ld-ken {
        from { transform: scale(1.04) translate3d(0, 0, 0); }
        to { transform: scale(1.1) translate3d(-1.2%, -0.8%, 0); }
      }
      #loading .ld-veil {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(180deg, #06080c88 0%, transparent 28%, transparent 52%, #06080cee 88%, #06080c 100%),
          linear-gradient(90deg, #06080c55 0%, transparent 35%, transparent 65%, #06080c44 100%);
      }
      #loading .ld-card {
        position: relative;
        z-index: 1;
        width: min(36rem, 92vw);
        margin: 0 0 max(4.5vh, 28px);
        padding: 0 8px;
        text-align: center;
        box-sizing: border-box;
        font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      }
      #loading .ld-kicker {
        margin: 0 0 8px;
        font: 700 0.72rem/1.3 system-ui, sans-serif;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #ff2bd6;
        text-shadow: 0 1px 8px #000c;
      }
      #loading h2 {
        margin: 0 0 18px;
        font-size: clamp(2.1rem, 7.5vw, 3.6rem);
        font-weight: 400;
        line-height: 0.95;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #fff;
        -webkit-text-stroke: 3px #080a0d;
        paint-order: stroke fill;
        text-shadow: 3px 4px 0 #080a0d, 0 0 28px #000a;
      }
      #loading .ld-dots i {
        font-style: normal;
        opacity: 0.35;
        animation: ld-dot 1.2s infinite;
      }
      #loading .ld-dots i:nth-child(2) {
        animation-delay: 0.2s;
      }
      #loading .ld-dots i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes ld-dot {
        0%, 70%, 100% { opacity: 0.35; }
        30% { opacity: 1; }
      }
      #loading .ld-track {
        height: 10px;
        border: 2px solid #080a0d;
        background: #ffffff22;
        overflow: hidden;
        box-shadow: 3px 3px 0 #080a0d;
      }
      #loading .ld-fill {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #c4129a, #ff2bd6 55%, #ff7ae8);
        transform-origin: left center;
        transform: scaleX(0.03);
        transition: transform 0.35s ease-out;
      }
      #loading.indet .ld-fill {
        animation: ld-pulse 1.4s ease-in-out infinite;
      }
      @keyframes ld-pulse {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; }
      }
      #loading .ld-sub {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
        font: 600 0.82rem/1.35 system-ui, sans-serif;
        color: #e8eef4;
        text-shadow: 0 1px 6px #000c;
      }
      #loading .ld-sub #ld-pct {
        color: #ff2bd6;
        font-variant-numeric: tabular-nums;
      }
      #loading.failed .ld-fill {
        background: #c23b2e;
        transform: scaleX(1);
      }
      @media (prefers-reduced-motion: reduce) {
        #loading,
        #loading .ld-fill {
          transition: none;
        }
        #loading .ld-art {
          animation: none;
          transform: none;
        }
        #loading .ld-dots i,
        #loading.indet .ld-fill {
          animation: none;
          opacity: 1;
        }
      }
      #hud {
        position: fixed;
        left: 20px;
        bottom: 20px;
        max-width: 28rem;
        padding: 14px 16px;
        background: var(--panel);
        border: 1px solid rgba(20, 40, 60, 0.12);
        pointer-events: none;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 1.05rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 0.88rem;
        line-height: 1.4;
        color: var(--muted);
      }
      #status {
        position: fixed;
        top: 18px;
        right: 20px;
        font-size: 0.8rem;
        color: var(--muted);
        background: var(--panel);
        padding: 8px 12px;
        border: 1px solid rgba(20, 40, 60, 0.12);
      }
      #hint {
        position: fixed;
        top: 18px;
        left: 20px;
        font-size: 0.8rem;
        color: var(--muted);
        background: var(--panel);
        padding: 8px 12px;
        border: 1px solid rgba(20, 40, 60, 0.12);
      }
      #modes {
        position: fixed;
        top: 56px;
        left: 20px;
        display: flex;
        gap: 8px;
      }
      #modes button {
        font: inherit;
        font-size: 0.8rem;
        padding: 8px 12px;
        border: 1px solid rgba(20, 40, 60, 0.16);
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
      }
      #modes button.active {
        background: #1a2430;
        color: #f4efe6;
      }
      #ride {
        position: fixed;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        min-width: 16rem;
        max-width: 28rem;
        padding: 12px 18px;
        background: var(--panel);
        border: 1px solid rgba(20, 40, 60, 0.14);
        text-align: center;
        display: none;
        pointer-events: none;
      }
      #ride .line {
        font-size: 0.95rem;
        font-weight: 600;
        margin: 0 0 4px;
      }
      #ride .next {
        font-size: 0.85rem;
        color: var(--muted);
        margin: 0;
      }
      #prompt {
        position: fixed;
        bottom: 96px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 16px;
        background: rgba(26, 36, 48, 0.82);
        color: #f4efe6;
        font-size: 0.88rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        display: none;
        pointer-events: none;
        white-space: nowrap;
      }

      /* ---- GTA-style HUD skin (no weapons): old panels hidden, prompts as a help box ---- */
      #hint,
      #modes,
      #status {
        display: none !important;
      }
      #prompt {
        top: 18px;
        bottom: auto;
        left: 22px;
        transform: none;
        max-width: 22rem;
        white-space: pre-line;
        background: rgba(10, 12, 16, 0.8);
        color: #f2f2f2;
        border: 0;
        border-radius: 4px;
        padding: 11px 14px;
        font: 500 0.9rem/1.4 "Helvetica Neue", Arial, sans-serif;
      }
      body.help-on #prompt {
        top: 196px;
      }
      #prompt .district-border {
        pointer-events: auto;
        white-space: normal;
      }
      #prompt .district-border-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      #prompt .district-border-actions button {
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border-radius: 4px;
        padding: 6px 12px;
        font: 600 0.85rem/1.2 system-ui, sans-serif;
      }
      #prompt .district-border-actions button[data-act="go"] {
        background: #ff2bd6;
        border-color: #ff2bd6;
        color: #120018;
      }
      #line-plan {
        position: fixed;
        top: 18px;
        left: 22px;
        min-width: 14rem;
        max-width: 22rem;
        padding: 12px 16px;
        background: rgba(10, 12, 16, 0.86);
        color: #f2f2f2;
        border-radius: 4px;
        text-align: left;
        display: none;
        pointer-events: none;
        z-index: 4;
      }
      #line-plan .line {
        font-size: 0.95rem;
        font-weight: 600;
        margin: 0 0 4px;
      }
      #line-plan .next {
        font-size: 0.9rem;
        line-height: 1.45;
        margin: 0;
      }
      #ride {
        top: 18px;
        background: rgba(10, 12, 16, 0.78);
        border: 0;
        border-radius: 4px;
        color: #fff;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }
      #ride .line {
        color: #ffd800;
        letter-spacing: 0.04em;
      }
      #ride .next {
        color: #e6e6e6;
      }
      #hud {
        left: 50%;
        top: 22%;
        bottom: auto;
        transform: translateX(-50%);
        max-width: none;
        background: none;
        border: 0;
        text-align: center;
        font-family: "Helvetica Neue", Arial, sans-serif;
        text-shadow: 0 0 3px #000, 0 2px 3px #000;
        transition: opacity 1.2s ease;
      }
      #hud h1 {
        color: #fff;
        font-size: 2.4rem;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      #hud p {
        color: #f0f0f0;
        font-size: 1rem;
      }
      #hud.gone {
        opacity: 0;
      }
      #click-cue {
        position: fixed;
        left: 50%;
        top: 58%;
        transform: translate(-50%, -50%);
        padding: 12px 22px;
        background: rgba(10, 12, 16, 0.72);
        color: #fff;
        font: 700 1rem "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        border-radius: 4px;
        pointer-events: none;
        z-index: 700;
      }
      body.locked #click-cue,
      body.free-view #click-cue,
      body.on-transit #click-cue,
      body:has(#loading) #click-cue,
      #click-cue.gone {
        display: none;
      }
      body.touch-device #click-cue {
        letter-spacing: 0.06em;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 22px;
        height: 22px;
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 0 2px #000);
        pointer-events: none;
        display: none;
      }
      #crosshair i {
        position: absolute;
        background: #fff;
        width: 6px;
        height: 1px;
        top: 10px;
      }
      #crosshair i:nth-child(2) { right: 0; }
      #crosshair i:nth-child(3) { width: 1px; height: 6px; top: 0; left: 10px; }
      #crosshair i:nth-child(4) { width: 1px; height: 6px; top: auto; bottom: 0; left: 10px; }
      body.locked #crosshair {
        display: block;
      }
      body.free-view #crosshair,
      body.on-transit #crosshair,
      body.menu-open #crosshair {
        display: none !important;
      }

      /* ---- City poster menu (title / pause) ---- */
      #city-menu {
        position: fixed;
        inset: 0;
        z-index: 900;
        overflow: hidden;
        color: #fff;
        font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
      }
      #city-menu .cm-poster {
        position: absolute;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      #city-menu .cm-bg {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        pointer-events: none;
      }
      #city-menu .cm-scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, #081927aa, transparent 62%),
          linear-gradient(0deg, #06121fd0, transparent 28%);
        pointer-events: none;
      }
      #city-menu .cm-home {
        position: relative;
        z-index: 1;
        width: min(42%, 28rem);
        margin-left: 7%;
        height: calc(100dvh - 72px);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        padding-top: 4dvh;
      }
      #city-menu .cm-home[hidden],
      #city-menu .cm-panel[hidden],
      #city-menu .cm-portrait-wrap[hidden] {
        display: none !important;
      }
      #city-menu .cm-logo {
        width: auto;
        height: min(28dvh, 200px);
        max-width: 100%;
        object-fit: contain;
        filter: drop-shadow(3px 6px 1px #0007);
        animation: cm-fly .38s cubic-bezier(.16, 1, .3, 1) both;
      }
      /* Large right-side cast plate: waist-up, planted on the bottom-right. */
      #city-menu .cm-portrait-wrap {
        position: absolute;
        right: 0;
        bottom: 0;
        top: auto;
        left: auto;
        z-index: 1;
        width: min(48vw, 640px);
        height: min(85dvh, 880px);
        overflow: hidden;
        pointer-events: none;
        transform: none;
        -webkit-mask-image: linear-gradient(180deg, #000 0 80%, transparent 100%);
        mask-image: linear-gradient(180deg, #000 0 80%, transparent 100%);
      }
      #city-menu .cm-portrait {
        display: block;
        position: absolute;
        right: 6%;
        bottom: 0;
        height: 100%;
        width: auto;
        max-width: 100%;
        object-fit: contain;
        object-position: center bottom;
        filter:
          drop-shadow(0 22px 36px #000d)
          drop-shadow(0 4px 12px #0008);
      }
      #city-menu .cm-nav {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 2px;
        margin-top: 2dvh;
        min-width: min(100%, 16rem);
        animation: cm-fly .4s 40ms cubic-bezier(.16, 1, .3, 1) both;
      }
      #city-menu .cm-item {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0;
        border: 0;
        padding: 0.35em 0.85em 0.35em 0.7em;
        background: transparent;
        color: #fff;
        font: 700 clamp(18px, 2.8dvh, 28px)/1.35 system-ui, "Segoe UI", sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-align: left;
        text-shadow: 0 1px 8px #000a;
        cursor: pointer;
      }
      #city-menu .cm-item::after {
        content: "";
        width: 0.55em;
        opacity: 0;
        font-size: 0.85em;
      }
      #city-menu .cm-item.selected {
        background: #ff2bd6;
        color: #fff;
        text-shadow: none;
        box-shadow: 0 0 24px #ff2bd655;
      }
      #city-menu .cm-item.selected::after {
        content: "›";
        opacity: 1;
        font-weight: 400;
      }
      #city-menu .cm-status {
        margin-top: 14px;
        font: 12px/1.5 system-ui, sans-serif;
        color: #e0e7ed;
      }
      #city-menu .cm-hid {
        margin: 10px 0 0;
        font: 600 13px/1 system-ui, sans-serif;
        letter-spacing: 0.03em;
        color: #1a1208;
        background: #f4e7c5;
        border: 0;
        border-radius: 999px;
        padding: 8px 14px;
        cursor: pointer;
      }
      #city-menu .cm-hid:hover { background: #fff; }
      #city-menu .cm-pad-actions { display: flex; gap: 10px; margin: 0 0 16px; }
      #city-menu .cm-pad-actions[hidden] { display: none; }
      #city-menu .cm-pad-actions .cm-hid { margin: 0; }
      #city-menu #cm-disconnect {
        background: transparent;
        color: #fff;
        border: 1px solid #ffffff55;
      }
      #city-menu #cm-controls .cm-back.selected,
      #city-menu .cm-hid.selected {
        background: #ff2bd6;
        color: #fff;
        border-color: #ff2bd6;
        box-shadow: 0 0 18px #ff2bd688;
      }
      #city-menu .cm-controls-note {
        margin: -8px 0 16px;
        min-height: 1.4em;
        font: 14px/1.45 system-ui, sans-serif;
        color: #e0e7ed;
      }
      #city-menu .cm-about-lead {
        margin: 0 0 18px;
        font: 500 17px/1.45 system-ui, sans-serif;
        color: #f2f6f9;
      }
      #city-menu .cm-about-sources {
        margin: 0 0 22px;
        padding: 0;
        list-style: none;
        font: 14px/1.55 system-ui, sans-serif;
        color: #c5d0d8;
      }
      #city-menu .cm-about-sources li + li { margin-top: 10px; }
      #city-menu .cm-about-sources a {
        color: #ff9ae8;
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      #city-menu .cm-about-sources a:hover { color: #fff; }
      #city-menu .cm-footer {
        position: absolute;
        bottom: 14px;
        left: 4%;
        display: flex;
        gap: 18px;
        font: 11px/1.6 system-ui, sans-serif;
        color: #d7e0e7;
        z-index: 2;
      }
      #city-menu .cm-footer kbd {
        display: inline-block;
        padding: 1px 6px;
        border: 1px solid #ffffff55;
        border-radius: 4px;
        margin-right: 4px;
        font: 10px/1.4 ui-monospace, monospace;
      }
      #city-menu .cm-sound {
        margin-left: 8px;
        padding: 2px 8px;
        border: 1px solid #ffffff55;
        border-radius: 4px;
        background: transparent;
        color: #d7e0e7;
        font: 11px/1.4 system-ui, sans-serif;
        cursor: pointer;
      }
      #city-menu .cm-sound[aria-pressed="true"] { opacity: 0.55; }
      #city-menu .cm-panel {
        position: relative;
        z-index: 2;
        width: min(720px, 92vw);
        margin: 8vh auto 0;
        padding: 28px 32px 24px;
        background: linear-gradient(125deg, #162b3af5, #090e16fc);
        border: 2px solid #080a0d;
        border-top: 5px solid #ff2bd6;
        box-shadow: 0 18px 48px #000a;
        font-family: system-ui, sans-serif;
      }
      #city-menu .cm-panel.cm-maps-panel {
        width: min(980px, 94vw);
        animation: cm-fly .32s cubic-bezier(.16, 1, .3, 1) both;
      }
      #city-menu .cm-maps-bar {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        margin: 0 0 14px;
      }
      #city-menu .cm-maps-bar .cm-back {
        margin: 2px 0 0;
        flex: 0 0 auto;
      }
      #city-menu .cm-maps-heading {
        min-width: 0;
        flex: 1 1 auto;
      }
      #city-menu .cm-maps-heading h2 {
        margin: 0;
      }
      #city-menu .cm-panel h2 {
        margin: 0 0 18px;
        font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
        font-size: clamp(28px, 5vw, 44px);
        letter-spacing: 0.02em;
      }
      #city-menu .cm-controls-live {
        margin: 0 0 16px;
        min-height: 2.8em;
        font: 13px/1.45 ui-monospace, Menlo, monospace;
        color: #d7e0e7;
      }
      #city-menu .cm-controls-list {
        list-style: none;
        margin: 0 0 18px;
        padding: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 28px;
      }
      #city-menu .cm-controls-list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font: 500 15px/1.45 system-ui, sans-serif;
        border-bottom: 1px solid #ffffff14;
        padding-bottom: 6px;
      }
      #city-menu .cm-controls-list kbd {
        display: inline-block;
        min-width: 1.4em;
        padding: 0 6px;
        text-align: center;
        background: #f2f2f2;
        color: #111;
        border-radius: 3px;
        font: 700 13px/1.5 system-ui, sans-serif;
      }
      @media (max-width: 700px) {
        #city-menu .cm-controls-list { grid-template-columns: 1fr; }
      }
      #city-menu .cm-eyebrow {
        margin: 0 0 6px;
        font: 11px/1.4 system-ui, sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #ff2bd6;
      }
      #city-menu .cm-maps-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(240px, 42%);
        gap: 22px;
        align-items: stretch;
      }
      #city-menu .cm-atlas {
        position: relative;
        perspective: 1400px;
        perspective-origin: 50% 30%;
        min-height: 420px;
        overflow: hidden;
      }
      /* Slight sideways + backwards tilt; labels counter-rotate so they stay upright. */
      #city-menu .cm-atlas-tilt {
        position: relative;
        width: 100%;
        aspect-ratio: 1.1;
        transform: rotateX(22deg) rotateZ(-6deg);
        transform-style: preserve-3d;
        transform-origin: 50% 60%;
      }
      #city-menu .cm-atlas-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        filter: drop-shadow(0 18px 22px #000a);
      }
      #city-menu .cm-area {
        fill: #2b4a5e;
        stroke: #0b141c;
        stroke-width: 34;
        stroke-linejoin: round;
        cursor: pointer;
        transition: fill .15s ease;
      }
      #city-menu .cm-area.inert {
        fill: #1a2630;
        stroke: #0b141c;
        cursor: default;
        pointer-events: none;
      }
      #city-menu .cm-area.locked { fill: #34404b; }
      #city-menu .cm-water {
        fill: #2f6f9c;
        stroke: #5fa3cf;
        stroke-width: 10;
        stroke-linejoin: round;
        pointer-events: none;
      }
      #city-menu .cm-area.hover { fill: #3d6a85; }
      #city-menu .cm-area.locked.hover { fill: #46535f; }

        <div class="ld-track"><div class="ld-fill" id="ld-fill"></div></div>

    <script>
      // Loading screen + GLB download. Runs before the (CDN-hosted) three.js module so the
      // 60 MB district download overlaps with the engine download instead of waiting for it.
      (() => {
        const root = document.getElementById("loading");
        // Key art rotates per visit: the cast poster plus the generic Metropolis splash pool.
        const art = [
          "./menu/loading-antwerp.jpg",
          "./menu/splash/generic-1.jpg",
          "./menu/splash/generic-2.jpg",
          "./menu/splash/generic-3.jpg",
          "./menu/splash/generic-4.jpg",
        ];
        const artEl = root.querySelector(".ld-art");
        artEl.addEventListener("error", () => {
          if (!artEl.src.endsWith(art[0].slice(1))) artEl.src = art[0];
        });
        artEl.src = art[Math.floor(Math.random() * art.length)];
        const fill = document.getElementById("ld-fill");
        const stage = document.getElementById("ld-stage");
        const pct = document.getElementById("ld-pct");
        let shown = 0;
        window.__loading = {
          set(frac, label) {
            shown = Math.max(shown, Math.min(1, frac));
            root.classList.remove("indet");
            fill.style.transform = "scaleX(" + Math.max(0.03, shown).toFixed(3) + ")";
            pct.textContent = Math.round(shown * 100) + "%";
            if (label) stage.textContent = label;
          },
          done() {
            this.set(1, "Ready");
            root.classList.add("done");
            setTimeout(() => root.remove(), 1000);
          },
          fail(msg) {
            root.classList.remove("indet");
            root.classList.add("failed");
            stage.textContent = msg;
            pct.textContent = "";
          },
        };
        window.__glbPromise = (async () => {
          if (window.__DISTRICT && window.__DISTRICT.ready) await window.__DISTRICT.ready;
          // Spawn-core first; fall back to city.glb / legacy monolith.
          const candidates = [];
          if (typeof window.districtCoreUrl === "function") candidates.push(window.districtCoreUrl());
          if (typeof window.districtUrl === "function") {
            candidates.push(window.districtUrl("core.glb"));
            candidates.push(window.districtUrl("city.glb"));
          }
          candidates.push("./klein_antwerpen.glb");
          let res = null;
          let glbUrl = candidates[0];
          for (const url of candidates) {
            glbUrl = url;
            res = await fetch(url, { priority: "high" });
            if (res.ok) break;
          }
          if (!res || !res.ok) throw new Error("GLB HTTP " + (res && res.status));
          if (!res.body) return res.arrayBuffer();
          // fetch() yields decoded bytes. GitHub Pages gzips the city file, so
          // Content-Length is the ~17 MB wire size, not the ~56 MB file. Using the
          // wire size as the total pins the bar at 80% for the rest of the download.
          const wire = +res.headers.get("Content-Length") || 0;
          const estimate = !wire || wire >= 24e6 ? wire || 58e6 : Math.round(wire * 3.22);
          const reader = res.body.getReader();
          const chunks = [];
          let got = 0;
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            got += value.length;
            const denom = Math.max(estimate, got / 0.98);
            const f = Math.min(0.98, got / denom);
            window.__loading.set(f * 0.8, "Fetching the streets");
          }
          const buf = new Uint8Array(got);
          let off = 0;
          for (const c of chunks) {
            buf.set(c, off);
            off += c.length;
          }
          return buf.buffer;
        })();
        window.__glbPromise.catch(() => {}); // surfaced by the viewer module
        // Repeat visits. GitHub Pages forces Cache-Control: max-age=600, so images
        // would be fetched again every ten minutes. The worker keeps them.
        if ("serviceWorker" in navigator && location.hostname.endsWith("github.io")) {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        }
      })();
    </script>

              : result.capacity === "—"
                ? `On a Velo · ${result.name}`
                : `On a Velo · ${result.bikes}/${result.capacity} left at ${result.name}`;
            return;
          }
          if (result.action === "return") {
            avatar.visible = mode !== "walk";
            rideEl.style.display = "none";
            promptEl.style.display = "none";
            hint.textContent = hintFor("walkShort");
            status.textContent = `Returned Velo at ${result.name}`;
            return;
          }
          if (result.action === "dismount") {
            avatar.visible = mode !== "walk";
            rideEl.style.display = "none";
            promptEl.style.display = "none";
            hint.textContent = hintFor("walkShort");
            status.textContent = "Hopped off — E remounts the parked bike";
            return;
          }
          if (result.action === "empty") {
            status.textContent = "No bikes left here";
            return;
          }
          if (onVelo) return;
        }
        if (onVelo) return;
        if (handleScooterE(p)) return;
        if (useCounter(p)) return;
        if (!onTram && !scooters?.isRiding() && interiors?.findEnterable(p, playerMotion.yaw()) && handleInteriorE(p)) return;
        const result = transit.tryInteract({ x: p.x, z: p.z });
        if (result.action === "plan") {
          showLinePlan(result);
          promptEl.style.display = "none";
          return;
        }
        if (result.action === "board") {
          // Stay pointer-locked: unlock() fires pointerlockchange → pause menu.
          // Mouse look is already gated off while transit.isRiding().
          playerAvatar.setVisible(false);
          rideEl.style.display = "block";
          rideLine.textContent = `${result.mode === "bus" ? "Bus" : "Tram"} ${result.line}`;
          rideNext.textContent = `Next halt: ${result.nextHalt}`;
          promptEl.style.display = "none";
          hint.textContent = hintFor("ride");
          status.textContent = `On board · next ${result.nextHalt}`;
        } else if (result.action === "request_alight") {
          rideNext.textContent = `Getting off at: ${result.nextHalt}`;
          hint.textContent = `Stop requested — leave at ${result.nextHalt}`;
          status.textContent = `Alighting at ${result.nextHalt}`;
        } else if (result.action === "alight") {
          applyAlightDrop(result.drop);
        }
      }

      function localizePrompt(text) {
        if (!text) return text;
        if (touch && !gamepad.connected()) return touch.softenPrompt(text);
        if (!gamepad.connected()) return text;
        const name = interactLabel(gamepad.layout);
        return text
          .replace(/Press E to /gi, `Press ${name} to `)
          .replace(/^E · /i, `${name} · `)
          .replace(/ · E to leave/gi, ` · ${name} to leave`);
      }

      function showPrompt(text) {

      function applySpawnFromNode(node) {
        const p = new THREE.Vector3();
        node.getWorldPosition(p);
        spawnPos.copy(p);
        if (Math.abs(p.y - eyeHeight) > 3) spawnPos.y = eyeHeight;
        clampWalkerXZ(spawnPos);
        walkControls.getObject().position.copy(spawnPos);
        const e = new THREE.Euler().setFromQuaternion(node.getWorldQuaternion(new THREE.Quaternion()));
        thirdPerson.setYaw(e.y);
      }

      function applySpawnJson(spawn) {
        coreCentre = { x: spawn.x, z: -spawn.y, r: 160 };
        spawnPos.set(spawn.x, spawn.z, -spawn.y);
        clampWalkerXZ(spawnPos);
        walkControls.getObject().position.copy(spawnPos);
        thirdPerson.setYaw(spawn.yaw ?? 0);

      async function loadSpawnJson() {
        try {
          const url =
            (typeof window.districtUrl === "function" && window.districtUrl("spawn.json")) ||
            "./spawn.json";
          let res = await fetch(url);
          if (!res.ok && url !== "./spawn.json") res = await fetch("./spawn.json");
          if (!res.ok) return null;
          return await res.json();
        } catch {
          return null;
        }
      }

      const loader = new GLTFLoader();
      // City GLB is Meshopt-compressed (scripts/compress_glb.mjs); decoder is WASM.
      loader.setMeshoptDecoder(MeshoptDecoder);
      // Hidden tabs never fire rAF; the timeout keeps loading moving in the background.
      const nextFrame = () =>
        new Promise((r) => {
          requestAnimationFrame(() => r());
          setTimeout(r, 100);
        });
      const setLoad = (f, label) => window.__loading && window.__loading.set(f, label);
      let cityReady = false;
      let districtBorder = null;
      const _districtOrigin = { lat: 51.2017, lon: 4.4114 };

      function projectGateLatLon(lat, lon) {
        // cityview.geo.project → Blender XY; Three.js z = -y
        const mLat = 110540.0;
        const mLon = 111320.0 * Math.cos((_districtOrigin.lat * Math.PI) / 180);
        const x = (lon - _districtOrigin.lon) * mLon;
        const y = (lat - _districtOrigin.lat) * mLat;
        return { x, z: -y };
      }

      function unprojectXZ(x, z) {
        const mLon = 111320.0 * Math.cos((_districtOrigin.lat * Math.PI) / 180);
        return { lat: _districtOrigin.lat - z / 110540.0, lon: _districtOrigin.lon + x / mLon };
      }

      /** district.json (origin, boundary, spawn); loaded once before spawn placement. */
      let _districtDocPromise = null;
      function loadDistrictDoc() {
        if (!_districtDocPromise) {
          _districtDocPromise = (async () => {
            const id = (window.__DISTRICT && window.__DISTRICT.id) || "2018-harmonie";
            const candidates = [
              typeof window.districtUrl === "function" ? window.districtUrl("district.json") : null,
              "./districts/" + id + "/district.json",
            ].filter(Boolean);
            for (const url of candidates) {
              try {
                const res = await fetch(url);
                if (!res.ok) continue;
                const doc = await res.json();
                if (doc && Array.isArray(doc.origin)) {
                  _districtOrigin.lat = doc.origin[0];
                  _districtOrigin.lon = doc.origin[1];
                }
                return doc;
              } catch (_) {
                /* try the next candidate */
              }
            }
            return null;
          })();
        }
        return _districtDocPromise;
      }

      // glTF has no Lambert shader, so every Principled material arrives as MeshStandardMaterial
      // and samples the scene environment. Keep that for glass, water, gold and car paint
      // (name test matches blender/build_city.py _tag_pbr; extras override it after a rebuild).
      function keepCityPbr(mat) {
        // High: keep roads / metal / roofs as Standard for sheen + wetness.
        if (visuals.high()) return visuals.keepCityPbr(mat);
        const tag = mat.userData && mat.userData.cityview_shader;
        if (tag === "pbr") return true;
        if (tag === "lambert") return false;
        const n = (mat.name || "").toLowerCase();
        return n.includes("glass") || n.includes("water") || n.includes("gold") || n.startsWith("car_");
      }

      function toLambert(mat) {
        const lambert = new THREE.MeshLambertMaterial();
        lambert.name = mat.name;
        lambert.color.copy(mat.color);
        lambert.map = mat.map || null;
        lambert.normalMap = mat.normalMap || null;
        if (mat.normalScale) lambert.normalScale.copy(mat.normalScale);
        if (mat.normalMapType != null) lambert.normalMapType = mat.normalMapType;
        lambert.emissive.copy(mat.emissive);
        lambert.emissiveMap = mat.emissiveMap || null;
        lambert.emissiveIntensity = mat.emissiveIntensity;
        lambert.aoMap = mat.aoMap || null;
        if (mat.aoMapIntensity != null) lambert.aoMapIntensity = mat.aoMapIntensity;
        lambert.alphaMap = mat.alphaMap || null;
        lambert.transparent = mat.transparent;
        lambert.opacity = mat.opacity;
        lambert.alphaTest = mat.alphaTest;
        lambert.side = mat.side;
        lambert.depthWrite = mat.depthWrite;
        lambert.depthTest = mat.depthTest;
        lambert.vertexColors = mat.vertexColors;
        lambert.fog = mat.fog;
        lambert.flatShading = mat.flatShading;
        lambert.toneMapped = mat.toneMapped;
        if (mat.polygonOffset) {
          lambert.polygonOffset = true;
          lambert.polygonOffsetFactor = mat.polygonOffsetFactor;
          lambert.polygonOffsetUnits = mat.polygonOffsetUnits;
        }
        return lambert;
      }

      // One Lambert per shared material, before the day/night pass and the tile merge,
      // so glow lists and batches see the cheap shader. Textures stay shared.
      function downgradeCityMaterials(root) {
        const cache = new Map();
        const retired = [];
        let pbr = 0;
        root.traverse((obj) => {
          if (!obj.isMesh || !obj.material) return;
          const list = Array.isArray(obj.material) ? obj.material : [obj.material];
          let changed = false;
          const next = list.map((m) => {
            if (!m || !m.isMeshStandardMaterial) return m;
            if (keepCityPbr(m)) {
              if (!cache.has(m.uuid)) {
                cache.set(m.uuid, m);
                pbr++;
              }
              return m;
            }
            let lambert = cache.get(m.uuid);
            if (!lambert) {
              lambert = toLambert(m);
              cache.set(m.uuid, lambert);
              retired.push(m);
            }
            changed = true;
            return lambert;
          });
          if (changed) obj.material = Array.isArray(obj.material) ? next : next[0];
        });
        for (const m of retired) m.dispose();
        shadeHedges(root);
        shadeTrees(root);
        paintRoadMarkings(root);
        paintLawns(root);
        shadeStreets(root);
        return { lambert: retired.length, pbr };
      }

      // Merge static city meshes that share a material into ~128 m tiles. The GLB ships ~12k
      // meshes (one draw call each); after this it is a few hundred, while per-tile frustum
      // culling still drops everything behind/beside the camera. Geometry is baked in root
      // space, so materials, polygon-offset layers and look are untouched.
      /**
       * Plain Float32 copy of a geometry. Meshopt GLBs ship quantized, interleaved attributes
       * (Int16 positions, Int8 normals) that can neither take a baked transform nor merge.
       */
      function floatGeometry(src) {
        const g = new THREE.BufferGeometry();
        for (const [name, a] of Object.entries(src.attributes)) {
          if (a.array instanceof Float32Array && !a.isInterleavedBufferAttribute && !a.normalized) {
            g.setAttribute(name, a.clone());
            continue;
          }
          const n = a.count;
          const k = a.itemSize;
          const out = new Float32Array(n * k);
          for (let i = 0; i < n; i++) {
            const o = i * k;
            out[o] = a.getX(i);
            if (k > 1) out[o + 1] = a.getY(i);
            if (k > 2) out[o + 2] = a.getZ(i);
            if (k > 3) out[o + 3] = a.getW(i);
          }
          g.setAttribute(name, new THREE.BufferAttribute(out, k));
        }
        if (src.index) g.setIndex(src.index.clone());
        return g;
      }

      function mergeStaticMeshes(root, tile = 128, { keepGround = false } = {}) {
        const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
        const rel = new THREE.Matrix4();
        const centre = new THREE.Vector3();
        const buckets = new Map();
        root.traverse((obj) => {
          if (!obj.isMesh || obj.isSkinnedMesh || obj.isInstancedMesh || Array.isArray(obj.material)) return;
          // Hidden (removed buildings) must stay hidden.
          if (!obj.visible) return;
          // Landmark stand-ins are swapped for streamed GLBs; merging them into a
          // tile would leave a beige slab that can no longer be hidden.
          const meshName = obj.name || "";
          // Walkable surfaces batch apart so a tile's name still tells groundAt what it holds.
          const ground = GROUND_MESH.test(meshName) ? (/sidewalk/i.test(meshName) ? "s" : "g") : "-";
          if (keepGround && ground !== "-") return;
          if (/^(?:lmbase_|lmhold_)/.test(meshName)) return;
          let holdParent = obj.parent;
          while (holdParent) {
            if (/^(?:lmbase_|lmhold_)/.test(holdParent.name || "")) return;
            holdParent = holdParent.parent;
          }
          if (obj.children.length) return; // would orphan child nodes
          const g = obj.geometry;
          const pos = g && g.attributes.position;
          if (!pos || Object.keys(g.morphAttributes).length) return;
          if (!g.boundingBox) g.computeBoundingBox();
          rel.multiplyMatrices(inv, obj.matrixWorld);
          g.boundingBox.getCenter(centre).applyMatrix4(rel);
          // Huge meshes (ground, long roads) stay as-is: merging them would bloat tile bounds.
          const ext = g.boundingBox.getSize(_clampTmp);
          if (Math.max(ext.x, ext.z) > tile * 1.5) return;
          const sig = Object.keys(g.attributes).sort().join(",") + (g.index ? "|i" : "|n");
          // renderOrder keeps lawn / courtyards behind the pond cutters (water.js RENDER_ORDER).
          const key = `${obj.material.uuid}|${sig}|${ground}|${obj.renderOrder}|${Math.floor(centre.x / tile)}|${Math.floor(centre.z / tile)}`;
          let b = buckets.get(key);
          if (!b) buckets.set(key, (b = { material: obj.material, meshes: [], mats: [] }));
          b.meshes.push(obj);
          b.mats.push(rel.clone());
        });
        let before = 0;
        let after = 0;
        const meshes = [];
        for (const b of buckets.values()) {
          if (b.meshes.length < 2) continue;
          const geoms = b.meshes.map((m, i) => {
            const g = floatGeometry(m.geometry);
            g.applyMatrix4(b.mats[i]);
            return g;
          });
          const merged = mergeGeometries(geoms, false);
          for (const g of geoms) g.dispose();
          if (!merged) continue; // incompatible attributes: leave the originals alone
          merged.computeBoundingSphere();
          const mesh = new THREE.Mesh(merged, b.material);
          mesh.name = `merged_${b.meshes[0].name || "mesh"}`;
          mesh.renderOrder = b.meshes[0].renderOrder;
          mesh.castShadow = false;
          mesh.receiveShadow = false;
          mesh.frustumCulled = true;
          mesh.matrixAutoUpdate = false;
          mesh.updateMatrix();
          root.add(mesh);
          meshes.push(mesh);
          for (const m of b.meshes) {
            m.geometry.dispose();
            m.removeFromParent();
          }
          before += b.meshes.length;
          after++;
        }
        return { before, after, meshes };
      }

      // Pre-compile every shader variant (day, and night with the pooled lamp lights) while
      // the loading screen is still up, then upload geometry with one throw-away frame.
      async function warmUpRenderer() {
        const wasLit = lampsLit;
        for (const l of lampLights) l.visible = true;
        try {
          await renderer.compileAsync(scene, camera);
        } catch (e) {
          console.warn("shader pre-compile skipped", e);
        }
        for (const l of lampLights) l.visible = wasLit;
        renderer.render(scene, camera);
      }

      async function onCityLoaded(gltf) {
          cityRoot = gltf.scene;
          try {
            const pavement = await applyPavementFrontage(cityRoot, THREE);
            window.__buildingLift = pavement.lift || 0;
          } catch (err) {
            window.__buildingLift = 0;
            console.warn("[metropolis] pavement frontage skipped", err);
          }
          const shading = downgradeCityMaterials(cityRoot);
          const bareWalls = dressBareWalls(cityRoot);
          hideBakedVeloRacks(cityRoot);
          console.info(`[metropolis] shading: ${shading.lambert} lambert, ${shading.pbr} pbr, ${bareWalls} bare walls`);
          const liquid = applyLiquidMaterials(THREE, cityRoot);
          if (liquid.upgraded || liquid.ponds) {
            console.info(`[metropolis] water: ${liquid.upgraded} liquid materials, ${liquid.ponds} ponds sunk`);
          }
          try {
            const surfUrl =
              (typeof window.districtUrl === "function" && window.districtUrl("road-surfaces.json")) ||
              "./road-surfaces.json";
            const sres = await fetch(surfUrl);
            const surfaces = sres.ok ? await sres.json() : {};
            const streets = applyStreetSurfaces(cityRoot, THREE, surfaces);
            console.info(
              `[metropolis] streets: asphalt lifted ${streets.lifted}, ${streets.cobble} cobble`,
            );
          } catch (err) {
            console.warn("[metropolis] street surfaces skipped", err);
          }
          // Cheap: disable expensive features for FPS; freeze static transforms.
          // Coplanar street layers: constant bias (no slope factor) so a look
          // along the road cannot swap the stack. See ground-order.js.
          const layerBias = surfaceBias;
          await visualsReady;
          // One biased clone per source material and mesh-name class (the tuning below reads
          // the mesh name), not one per mesh: per-mesh clones left thousands of unique
          // materials, so mergeStaticMeshes could not batch the façades.
          const biasClones = new Map();
          const PBR_CLASS = /glass|water|gold|road_|asphalt|cobble|park_path|sidewalk|curb|tram_|rail_|roof|metal/g;
          const biasClone = (m, bias, n, isFacade) => {
            const key = `${m.uuid}|${bias.factor}|${isFacade ? 1 : 0}|${(n.match(PBR_CLASS) || []).join(",")}`;
            let c = biasClones.get(key);
            if (!c) biasClones.set(key, (c = m.clone()));
            return c;
          };
          cityRoot.traverse((obj) => {
            if (obj.isMesh) {
              obj.castShadow = false;
              obj.receiveShadow = false;
              obj.frustumCulled = true;
              if (obj.material) {
                const bias = layerBias(obj.name);
                const n = (obj.name || "").toLowerCase();
                const isFacade =
                  n.includes("facade") || n.includes("bldg_") || n.includes("chim") || n.includes("roof");
                // Facades / zebra_rail share materials with coplanar neighbours (building
                // rings, plain zebras); clone so the bias doesn't pull those forward too.
                if (bias && /facade|_landmark|zebra_rail/i.test(obj.name || "")) {
                  obj.material = Array.isArray(obj.material)
                    ? obj.material.map((m) => biasClone(m, bias, n, isFacade))
                    : biasClone(obj.material, bias, n, isFacade);
                }
                const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
                for (const m of mats) {
                  if (!m) continue;
                  // Smooth shading: facets were a strong "GTA 3" tell. Low keeps the old look.
                  m.flatShading = visuals.high() ? false : !isFacade;
                  if (m.name && /glass/i.test(m.name)) {
                    m.metalness = Math.max(m.metalness ?? 0, 0.45);
                    m.roughness = Math.min(m.roughness ?? 1, 0.18);
                    m.envMapIntensity = 1.1;
                  } else if (isFacade && m.roughness != null) {
                    m.envMapIntensity = 0.35;
                  }
                  visuals.tunePbrMaterial(m, obj.name || "");
                  visuals.patchHeightFog(m);
                  if (m.emissiveMap) {
                    visuals.varyWindowGlow(m);
                    const jitter = m.userData.glowJitter || 1;
                    glowMats.push({ mat: m, scale: 1.55 * jitter }); // lit windows
                  } else if (m.name === "lamp_head") {
                    glowMats.push({ mat: m, scale: 2.6 }); // street lamps
                  }
                  if (
                    m.color &&
                    m.name &&
                    /^(canopy_|trunk$|shrub)/i.test(m.name) &&
                    !vegMats.some((v) => v.mat === m)
                  ) {
                    vegMats.push({
                      mat: m,
                      day: m.color.clone(),
                      night: /^trunk$/i.test(m.name) ? TRUNK_NIGHT : VEG_NIGHT,
                      dayEnv: m.envMapIntensity ?? 1,
                    });
                  }
                  // Sunk ponds sit 0.38 m under the lawn; a slope-scaled push-back would sink
                  // them behind the -0.8 m far-field ground at grazing angles.
                  if (bias && !m.userData.cityviewPond) {
                    m.polygonOffset = true;
                    m.polygonOffsetFactor = bias.factor;
                    m.polygonOffsetUnits = bias.units;
                  }
                  m.needsUpdate = true;
                }
              }
            }
          });
          // Actor shadows onto streets first; building cast is a second step if perf allows.
          visuals.applyCityShadows(cityRoot, { castBuildings: false });
          visuals.applyAnisotropy(cityRoot);
          scene.add(cityRoot);
          cityRoot.updateMatrixWorld(true);
          // Overlapping cobbles take different 0.25 mm steps. A shared slot is
          // the patch that flickers between the cathedral and the Grote Markt.
          applySurfaceOrder(cityRoot);
          const flicker = auditSurfaceFlicker(cityRoot);
          window.__metropolis.groundFlicker = flicker;
          console.info(
            `[metropolis] ground flicker check: ${flicker.pairs} overlapping strips still share a depth (${flicker.checked} checked)`,
          );
          cityRoot.traverse((obj) => {
            obj.matrixAutoUpdate = false;
            if (obj.isMesh && /^lamp_h_/i.test(obj.name || "")) {
              lampHeads.push(new THREE.Vector3().setFromMatrixPosition(obj.matrixWorld));
            }
          });
          try {
            const [roadsRes, bldRes] = await Promise.all([
              fetchJsonCached("./roads.json"),
              fetchJsonCached("./buildings.json"),
            ]);
            const roadsDoc = roadsRes.ok ? await roadsRes.json() : null;
            const bldDoc = bldRes.ok ? await bldRes.json() : null;
            const poles = lampHeads.length;
            if (poles === 0 && roadsDoc && roadsDoc.roads) {
              const sites = lampSites(roadsDoc.roads, { spawn: roadsDoc.spawn });
              const placed = attachStreetLamps(THREE, cityRoot, sites);
              for (const h of placed.heads) lampHeads.push(new THREE.Vector3(h.x, h.y, h.z));
              if (placed.material) glowMats.push({ mat: placed.material, scale: 2.6 });
            }
            const posts = lampHeads.length;
            const extra = wallLightAnchors({
              lamps: lampHeads,
              roads: (roadsDoc && roadsDoc.roads) || [],
              buildings: (bldDoc && bldDoc.buildings) || [],
            });
            for (const p of extra) lampHeads.push(new THREE.Vector3(p.x, p.y, p.z));
            console.info(`[metropolis] lights: ${posts} street lamps, ${extra.length} second-floor fills`);
          } catch (err) {
            console.warn("[metropolis] wall lights skipped", err);
          }
          // Wrap kerbside cars + bolt-on lamps before merge so they stay discrete.
          // Per-car paint before merge — otherwise every parked car keeps the shared grey `car_paint`.
          paintParkedCars(cityRoot);
          parkedCars = wireParkedCarLamps(cityRoot, THREE);
          cityRoot.updateMatrixWorld(true);
          // Drop cars baked onto Velo rails / bike racks before mesh merge (live district GLB).
          await clearParkedCarsFromMicromobility(cityRoot, null);
          collectParkedCarSolids(cityRoot);
          setLoad(0.9, "Building the streets");
          await nextFrame();
          if (new URLSearchParams(location.search).get("merge") !== "0") {
            const m = mergeStaticMeshes(cityRoot);
            console.info(`[metropolis] merged ${m.before} meshes into ${m.after} tile batches`);
          }
          // Actor shadows onto streets first. Building cast is opt-in after the gate
          // (enable via visuals.applyCityShadows(cityRoot, { castBuildings: true })).
          visuals.applyCityShadows(cityRoot, { castBuildings: false });
          visuals.applyAnisotropy(cityRoot);
          // Static after the merge: skip per-frame matrix traversal of the (now small) tree.
          cityRoot.updateMatrixWorld(true); // bake world matrices of the merged tiles once
          cityRoot.traverse((obj) => (obj.matrixWorldAutoUpdate = false));
          collectGroundMeshes(cityRoot);
          const spawnNode = cityRoot.getObjectByName("HumanSpawn");
          const spawnJson = await loadSpawnJson();
          const ddocEarly = await loadDistrictDoc();
          const arrival = window.districtArrival;
          // spawn.json is the live district start. The baked HumanSpawn empty
          // stays at whatever the last city build used.
          if (spawnJson) applySpawnJson(spawnJson);
          else if (spawnNode) applySpawnFromNode(spawnNode);
          if (arrival && ddocEarly && ddocEarly.origin) {
            // Walked in across a border: keep the crossing point and heading.
            const p = projectGateLatLon(arrival.lat, arrival.lon);
            spawnPos.set(p.x, spawnPos.y, p.z);
            clampWalkerXZ(spawnPos);
            walkControls.getObject().position.copy(spawnPos);
            thirdPerson.setYaw(arrival.yaw);
            arrivedByBorder = true;
            const u = new URL(location.href);
            u.searchParams.delete("at");
            history.replaceState(null, "", u.toString());
          }
          setMode("walk");
          setLoad(0.94, "Starting traffic and trams");
          await nextFrame();
          traffic = await createTraffic(scene, THREE);
          transit = await createTransit(scene, THREE, { tramCount: 6, busCount: 8 });
          if (traffic.setOnHitPlayer) traffic.setOnHitPlayer((speed) => hitByVehicle(speed));
          if (transit.setOnHitPlayer) transit.setOnHitPlayer((speed) => hitByVehicle(speed));
          // A handful of people, then the other bodies and the rest of the crowd after the city is up.
          // Docks and sheds: a few dock workers, not a shopping-street crowd.
          const industrial = window.__DISTRICT?.stylePolicy === "industrial";
          pedestrians = await createPedestrians(scene, THREE, {
            count: industrial ? 10 : 40,
            firstCount: industrial ? 3 : 5,
            spawnCenter: { x: spawnPos.x, z: spawnPos.z },
            playBounds: playBounds || { minX: -500, maxX: 200, minZ: -800, maxZ: 100 },
            groundAt,
            camera,
            district: typeof window !== "undefined" ? window.__DISTRICT : null,
            hour: gameHour,
            day: gameDay,
          });
          if (pedestrians.setCrossingGate && traffic.pedMayCross) {
            pedestrians.setCrossingGate((id) => traffic.pedMayCross(id));
          }
          if (traffic.setPedestrians && pedestrians.roadPeople) {
            traffic.setPedestrians(() => pedestrians.roadPeople());
          }
          if (traffic.setOnHitPed && pedestrians.hitTest) {
            traffic.setOnHitPed((x, z, vx, vz, r) => pedestrians.hitTest(x, z, vx, vz, r));
          }
          // Walkers slide around parked and moving cars / buses / trams.
          if (pedestrians.setVehicles) {
            pedestrians.setVehicles(() => {
              _vehicleSolids.length = 0;
              for (const c of traffic.cars || []) {
                if (!c?.pos || !c.tan) continue;
                _vehicleSolids.push({ pos: c.pos, tan: c.tan, hl: 2.15, hw: 0.9 });
              }
              for (const v of transit.vehicles || []) {
                if (!v?.pos || !v.tan || v.phase === "gone") continue;
                const tram = v.mode === "tram";
                _vehicleSolids.push({
                  pos: v.pos,
                  tan: v.tan,
                  hl: tram ? 15.5 : 6.6,
                  hw: tram ? 1.2 : 1.25,
                });
              }
              for (const s of parkedCarSolids) _vehicleSolids.push(s);
              return _vehicleSolids;
            });
          }
          micromobility = await createMicromobility(scene, THREE, {
            count: 28,
            firstCount: 6,
            district: typeof window !== "undefined" ? window.__DISTRICT : null,
            hour: gameHour,
            day: gameDay,
            spawnCenter: { x: spawnPos.x, z: spawnPos.z },
            people: pedestrians?.people,
          });
          velo = await createVelo(scene, THREE);
          scooters = await createScooters(scene, THREE, {
            spawnCenter: { x: spawnPos.x, z: spawnPos.z },
            groundAt,
          });
          // Hide any leftover cars sitting on a step that still spawned beside them.
          const stepCircles = (scooters?.fleet || []).map((s) => ({
            x: s.mesh.position.x,
            z: s.mesh.position.z,
            r: 1.6,
          }));
          if (stepCircles.length) {
            hideParkedCarsOverlapping(cityRoot, { circles: stepCircles }, parkedCarSolids);
            collectParkedCarSolids(cityRoot);
          }
          // Shop signs raycast the streets. They fill in after the city is on screen.
          minimap = createMinimap(THREE, {
            playBounds: playBounds || { minX: -500, maxX: 200, minZ: -800, maxZ: 100 },
            spawnCenter: { x: spawnPos.x, z: spawnPos.z },
            width: 200,
            height: 200,
            districtName:
              (typeof window !== "undefined" && window.__DISTRICT && window.__DISTRICT.title) ||
              "Antwerp",
            roadsUrl:
              (typeof window.districtUrl === "function" && window.districtUrl("roads.json")) ||
              "./roads.json",
            transitUrl:
              (typeof window.districtUrl === "function" && window.districtUrl("transit.json")) ||
              "./transit.json",
            mapUrl:
              (typeof window.districtUrl === "function" && window.districtUrl("map.json")) ||
              "./map.json",
            landmarksUrl:
              (typeof window.districtUrl === "function" && window.districtUrl("landmarks.json")) ||
              "./landmarks.json",
            shopsUrl:
              (typeof window.districtUrl === "function" && window.districtUrl("shops.json")) ||
              "./shops.json",
          });
          if (minimap.setBlips) {
            const BRAND = { Dott: "#18a6e0", Bolt: "#34d186" };
            const stations = (velo?.stations || []).map((st) => ({ x: st.x, z: st.z, color: "#e2001a" }));
            minimap.setBlips(() =>
              scooters.fleet
                .filter((s) => s.parked)
                .map((s) => ({ x: s.mesh.position.x, z: s.mesh.position.z, color: BRAND[s.brand] || "#fff" }))
                .concat(stations)
                .concat(police ? police.blips() : []),
            );
          }
          streetLocator = await createStreetLocator({
            mapUrl:
              (typeof window.districtUrl === "function" && window.districtUrl("map.json")) ||
              "./map.json",
            roadsUrl:
              (typeof window.districtUrl === "function" && window.districtUrl("roads.json")) ||
              "./roads.json",
          });
          outdoors = await createOutdoorsGuard();
          water = await createWater();
          if (water.ready) console.info(`[metropolis] water: ${water.count} bodies (wade / deep)`);
          props = await createPropCollider();
          if (pedestrians && outdoors.ready && pedestrians.setBlocker) {
            pedestrians.setBlocker((x, z) => outdoors.insideBuilding(x, z));
          }
          if (outdoors.ready) {
            clampWalkerXZ(walkControls.getObject().position);
            clampWalkerXZ(spawnPos);
            console.info(`[metropolis] outdoors guard: ${outdoors.count} building footprints`);
          } else {
            console.warn("[metropolis] outdoors guard: no buildings.json — indoor walk possible");
          }
          police = await createPolice(scene, THREE, {
            paths: traffic.paths || [],
            wanted,
            people: pedestrians?.people,
            inside: (x, z) => (outdoors?.ready ? outdoors.insideBuilding(x, z) : false),
            player: () => {
              const p = walkControls.getObject().position;
              return { x: p.x, z: p.z };
            },
            notify: (text) => hud.notify(text, 2800),
            onKilled: (d) => loot.drop(d.kind === "police" ? "police" : "pedestrian", d.x, Math.max(0, groundAt(d.x, d.z)), d.z),
            onShot(from, target) {
              _copMuzzle.set(from.x, from.y + 1.4, from.z);
              _copAim.set(target.x, walkControls.getObject().position.y - 0.4, target.z);
              combatPlayer.fx.remoteShot("pistol", _copMuzzle, _copAim, _copMuzzle.distanceTo(camera.position));
            },
          });
          pedestrians?.setOnKilled?.((d) => loot.drop("pedestrian", d.x, Math.max(0, groundAt(d.x, d.z)), d.z));
          pedestrians?.setPlayer?.(() => walkControls.getObject().position);
          pedestrians?.setOnAssault?.((hit) => {
            hurtPlayer(hit.damage);
            hud.notify("Knifed", 900);
          });
          // Cars give way to trams/buses instead of driving through them.
          if (traffic.setObstacles) traffic.setObstacles(() => transit.vehicles || []);
          const nCars = traffic.count ?? 0;
          const nTransit = transit.count ?? 0;
          const nPeds = pedestrians?.groups?.reduce((n, g) => n + g.members.length, 0) ?? 0;
          const nMicro = micromobility?.count ?? 0;
          const nVelo = velo?.count ?? 0;
          const bits = [];
          if (nCars > 0) bits.push(`${nCars} cars`);
          if (nTransit > 0) bits.push(`${nTransit} trams/buses`);
          if (nPeds > 0) bits.push(`${nPeds} people`);
          if (nMicro > 0) bits.push(`${nMicro} bikes/scooters`);
          if (nVelo > 0) bits.push(`${nVelo} Velo stations`);
          status.textContent =
            bits.length > 0
              ? `${tod > 0.5 ? "Night" : "Sunny day"} — ${bits.join(" · ")} · ${TOUCH ? "tap Go for Velo / tram" : "E Velo / tram"}`
              : TOUCH

                : "Sunny day — click to walk";
          setupDistrictBounds(cityRoot);

                  });
                  console.info(`[metropolis] far field: ${n} cells`);
                });
              removalDocs.push(ownDoc);
              // Core is already on screen — stream nearby cells in the background.
              void chunkStream.prime(spawnPos.x, spawnPos.z).then(() => {
                console.info(
                  `[metropolis] chunks: ${chunkStream.items.length} cells primed near spawn`,
                );
              });
              console.info(
                `[metropolis] chunks: ${chunkStream.items.length} cells (core first paint)`,
              );
            }
          } catch (err) {
            console.warn("[metropolis] chunks.json unavailable", err);
          }
          if (minimap && minimap.setBounds && playBounds) minimap.setBounds(playBounds);
          // Built neighbours stream across the shared border so the city never ends at the seam.
          try {
            neighbours = await createNeighbourDistricts({
              THREE,
              scene,
              loader,
              origin: _districtOrigin,
              project: projectGateLatLon,
              onChunkLoaded: (chunkRoot) => {
                if (window.__buildingLift) raiseStreetBuildings(chunkRoot, window.__buildingLift);
                dressBareWalls(chunkRoot);
                hideBakedVeloRacks(chunkRoot);
                applySurfaceOrder(chunkRoot);
                shadeHedges(chunkRoot);
                shadeTrees(chunkRoot);
                paintRoadMarkings(chunkRoot);
                paintLawns(chunkRoot);
                shadeStreets(chunkRoot);
                removedBuildings?.apply(chunkRoot);
                applyLiquidMaterials(THREE, chunkRoot);
                mergeChunk?.(chunkRoot);
              },
              onFootprints: (id, doc, t) => {
                const n = outdoors?.addBuildings ? outdoors.addBuildings(doc, t) : 0;
                console.info(`[metropolis] neighbour ${id}: ${n} footprints`);
              },
              onMapSource: (base, t) => {
                minimap?.addSource?.(base, t);
                streetLocator?.addSource?.(base, t);
              },
            });
            for (const n of neighbours.neighbours) {
              if (!farField) break;
              const docs = Promise.all([
                fetchJsonCached(n.base + "buildings.json").then((r) => (r.ok ? r.json() : null)),
                fetchJsonCached(n.base + "chunks.json").then((r) => (r.ok ? r.json() : null)),
              ]).then(([doc, cat]) => {
                if (!doc) return;
                removedBuildings?.add(doc);
                farField.addSource({
                  name: n.id,
                  doc,
                  stream: n.stream,
                  cellM: cat?.cell_m,
                  coreR: cat?.core_r,
                  transform: n.transform,
                });
              });
              removalDocs.push(docs);
            }
            if (neighbours.neighbours.length) {
              console.info(
                `[metropolis] neighbours: ${neighbours.neighbours.map((n) => n.id).join(", ")}`,
              );
            }
          } catch (err) {
            console.warn("[metropolis] neighbour districts unavailable", err);
          }
          districtBorder = createDistrictBorder({
            THREE,
            getPos: () => {
              const p = walkControls.getObject().position;
              return { x: p.x, z: p.z };
            },
            projectGate: projectGateLatLon,
            unproject: unprojectXZ,
            insideRing: insidePlayRing,
            insideNeighbour: (id, x, z) => !!neighbours?.insideNeighbour(id, x, z),
            getYaw: () => thirdPerson.yaw(),
            promptEl,
            radiusM: RING_BUFFER_M + 5,
          });
          await districtBorder.init();
          applyTimeOfDay(tod);
          setLoad(0.97, "Warming up the lights");
          await nextFrame();
          await warmUpRenderer();
          if (touch) {
            touch.setActive(true);
            touch.setNightLabel(tod > 0.5);
            if (!gamepad.connected()) hud.setHelpKind("touch");
          }
          setLoad(0.98, "Placing landmarks");
          await nextFrame();
          try {
            const lmUrl =
              (typeof window.districtUrl === "function" && window.districtUrl("landmarks.json")) ||
              "./landmarks.json";
            const lmRes = await fetch(lmUrl);
            if (lmRes.ok) {
              const catalog = await lmRes.json();
              landmarkStream = createLandmarkStream({ scene, loader, cityRoot, catalog });
              const here = walkControls.getObject().position;
              await landmarkStream.prime(here.x, here.z);
              const near = landmarkStream.items.filter(
                (item) => Math.hypot(item.x - here.x, item.z - here.z) <= LOAD_M,
              ).length;
              console.info(
                `[metropolis] landmarks: ${landmarkStream.items.length} catalog, ${near} within ${LOAD_M} m of spawn`,
              );
            }
          } catch (err) {
            console.warn("[metropolis] landmarks failed", err);
          }
          cityReady = true;
          prevTime = performance.now();
          window.__loading && window.__loading.done();
          await playerAvatar.ready();
          thirdPerson.setYaw(playerMotion.yaw());
          thirdPerson.snap(walkControls.getObject().position);
          gamepad.poll();
          publishStatus();
          if (arrivedByBorder && !TOUCH) {
            sessionStarted = true;
            helpShown = true;
            const cue = document.getElementById("click-cue");
            if (cue) cue.textContent = `Click to keep walking · ${districtMeta.title || "Antwerp"}`;
          } else {
            menu.show();
          }
          setTimeout(() => document.getElementById("hud")?.classList.add("gone"), 9000);
          requestAnimationFrame(() => {
            pedestrians?.streamVariety?.();
            micromobility?.streamVariety?.();
            traffic?.loadRest?.();
            minimap?.warmBase?.();
            void settleStreetLife();
          });
      }

      async function settleStreetLife() {

      }

          interiors = await createInteriors({
            THREE,
            scene,
            shops,
            people: pedestrians?.people || null,

            },

            },

          });

          const debugKey = _q.get("interior");

            console.info(rec ? `[metropolis] ?interior → ${rec.name} (${rec.template}/${rec.variant})` : `[metropolis] ?interior=${debugKey}: no match`);
          }
